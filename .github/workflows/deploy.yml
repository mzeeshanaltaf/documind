name: Deploy

# Push to main → check and deploy only what changed:
#   api/** or model-pricing.json → documind-api;  web/** → documind-web;
#   evaluation/api/** (+ evaluation/fixtures/** and api/eval/golden.jsonl, baked into its
#   image) → documind-eval-api;
#   evaluation/web/** → documind-eval-web;  office/** → documind-office-web.
#   .dockerignore → all five.
# Manual runs (Actions tab → Run workflow) deploy all five.
# Repo secrets: COOLIFY_BASE_URL, COOLIFY_API_TOKEN (deploy-scoped Coolify token).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

env:
  # Coolify application uuids (not secret: useless without the token).
  API_APP_UUID: anaat3diukcx2lizx4srhe8r
  WEB_APP_UUID: 7hf4gmnbhx1rmeepsrotndlt
  EVAL_API_APP_UUID: 5435bt2dyjlqfyhifpujfeyu
  EVAL_WEB_APP_UUID: 7ltejy3ne1khxjsah5ywywib
  OFFICE_WEB_APP_UUID: kxbtboozbohpqfjtujj9nf3z

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      eval_api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.eval_api == 'true' }}
      eval_web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.eval_web == 'true' }}
      office: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.office == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'model-pricing.json'
              - '.dockerignore'
            web:
              - 'web/**'
              - '.dockerignore'
            eval_api:
              - 'evaluation/api/**'
              - 'evaluation/fixtures/**'
              - 'api/eval/golden.jsonl'
              - '.dockerignore'
            eval_web:
              - 'evaluation/web/**'
              - '.dockerignore'
            office:
              - 'office/**'
              - '.dockerignore'

  check-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # The test suite needs the dev DB + MinIO, so CI only lints.
      - run: uv run --frozen --only-dev ruff check .

  check-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  check-eval-api:
    needs: changes
    if: needs.changes.outputs.eval_api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation/api
    # Settings needs these to import; the selected tests never connect (db/live are deselected).
    env:
      EVAL_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=documind_eval_ci
      EVAL_API_KEY: ci
      DOCUMIND_API_KEY: ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --only-dev ruff check .
      - run: uv run --frozen pytest -m "not db and not live" -q

  check-eval-web:
    needs: changes
    if: needs.changes.outputs.eval_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: evaluation/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: evaluation/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  check-office:
    needs: changes
    if: needs.changes.outputs.office == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: office/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: office/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest only (node + jsdom projects); the Playwright specs need the dev DB.
      - run: pnpm test

  deploy-api:
    needs: check-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Queue documind-api deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: bash .github/scripts/coolify-deploy.sh "$API_APP_UUID"

  deploy-web:
    needs: check-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Queue documind-web deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: bash .github/scripts/coolify-deploy.sh "$WEB_APP_UUID"

  deploy-eval-api:
    needs: check-eval-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Queue documind-eval-api deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: bash .github/scripts/coolify-deploy.sh "$EVAL_API_APP_UUID"

  deploy-eval-web:
    needs: check-eval-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Queue documind-eval-web deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: bash .github/scripts/coolify-deploy.sh "$EVAL_WEB_APP_UUID"

  deploy-office:
    needs: check-office
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Queue documind-office-web deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: bash .github/scripts/coolify-deploy.sh "$OFFICE_WEB_APP_UUID"
