[project]
name = "api"
version = "0.1.0"
description = "DocuMind API: ingestion, hybrid retrieval and agentic chat over company documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.26.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "snowballstemmer>=3.1.1",
    "sqlalchemy[asyncio]>=2",
    "sse-starlette>=3.5.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rank-bm25>=0.2.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
