[project]
name = "documind-eval-api"
version = "0.1.0"
description = "DocuMind Evaluation API: datasets, durable eval runs, metrics and judging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations hold long literal CHECK expressions.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# evaluation/api/alembic/ (migrations) would otherwise make the `alembic` package look first-party.
known-first-party = ["app", "tests", "scripts"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs the shared Postgres (schema documind_eval_test, created and dropped per session)",
    "live: calls a running DocuMind and/or Anthropic",
]
