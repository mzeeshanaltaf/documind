<body>
<div id="stage"><div id="cam"></div></div>
<div id="ui"><button id="pp">Play</button><input id="scr" type="range" min="0" max="18" step="0.01" value="0"><span id="tm">0.00s</span></div>
<script>
/* ============================================================================
   DocuMind: one-take explainer (hero ball travels the RAG workflow). Loops at 18 s, 120 BPM.
   NOTE: the beat sheet below is the original 16 s plan; the current times live in the `T` object.
   BEAT SHEET            time   what happens                                   sound
   toggle land           0.00   hero lands as the "Upload" toggle knob           marimba C + thump (seam)
   toggle on             0.50   knob slides on, PDF rows appear                  switch click, soft pops
   hop to slider         1.00   hero leaves the toggle (slot stays)              -
   slider land           1.75   hero becomes the Indexing thumb                  marimba
   roll to 100           1.75-3.25 value counts up, ticks speed up              ticks (accelerate)
   fall off the end      3.25   leaves slider at speed                           -
   card 1/2/3            3.50 / 4.00 / 4.50  pipeline cards pop as hit           pop + marimba (rising)
   fall to keyboard      4.50-5.50                                               -
   keys C A R R Y        5.50 6.00 6.50 6.75 7.25  letters appear in input       key clicks + marimba (rising)
   return                7.75   hero hits return, key presses                    thunk
   launch to answer      7.85-8.50  question + answer stream in                 -
   land on citation      8.50   hero sits on the source chip                     marimba
   press chip            9.20   chip turns green, cited page opens 9.3          click, paper swish
   highlight sweep       9.70-10.3 carry-over passage highlighted                -
   payoff hold           10.3-11.0
   launch + reveal       11.0   hero arcs high in slow motion, camera pulls out  whoosh up
   resets                12.0-13.5 everything resets behind it                   descending ticks
   dive                  13.6-15.2 camera dives to the toggle                    whoosh down
   land                  16.00  hero lands on the toggle knob (= t 0)
   ============================================================================ */

// ---------- helpers (from the skill) ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, k) => 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], k))).join() + ')';
// quick press that springs back
const dip = tau => tau < 0 ? 0 : tau < .06 ? tau / .06 : Math.exp(-(tau - .06) * 12);
const dipLong = tau => tau < 0 ? 0 : tau < .04 ? tau / .04 : tau < .2 ? 1 : Math.exp(-(tau - .2) * 14);
// squash after an impact (1 at contact, springs back)
const pulse = tau => tau < 0 || tau > .5 ? 0 : Math.exp(-tau * 10) * Math.cos(tau * 14);

const D = 18, W = 1920, H = 1080, G = 4200, R = 38;
window.VIDEO = { w: W, h: H, duration: D };
const RENDER = location.search.includes('render');
if (RENDER) document.documentElement.classList.add('render');

// ---------- colours ----------
const C = { paper: hex('#fbfdfc'), rule: hex('#dce1de'), edge: hex('#c6cfca'), green: hex('#1a5d48'), wash: hex('#e3eee9'), ink: hex('#121916'), muted: hex('#616a66') };

// ---------- timeline ----------
const T = { knobA: .5, knobB: .9, hop1: 1.0, slider: 1.75, rollEnd: 4.0, c1: 4.5, c2: 5.5, c3: 6.5,
  kC: 7.7, kA: 8.4, kR1: 9.1, kR2: 9.6, kY: 10.3, ret: 11.0, launch2: 11.1, chip: 11.8, press: 12.7, page: 12.8, hlA: 13.3, hlB: 14.0, launch: 15.0 };
const RS = x => T.launch + (x - 11) * .55;   // resets run during the reveal (old 11 s timeline compressed)
const DS = T.launch + 1.6;     // the camera starts its dive here
const CONTACTS = [0, T.slider, T.c1, T.c2, T.c3, T.kC, T.kA, T.kR1, T.kR2, T.kY, T.ret, T.chip];

// ---------- world layout ----------
const KX0 = -1770, KX1 = -1670, KY = -960;               // toggle knob off/on, centre y

  // ---- station 2: slider ----
  const roll = clamp((t - T.slider) / ROLL_DUR);
  const v = (t < T.slider ? 0 : t < T.rollEnd ? Math.pow(roll, ROLL_P) : 1) * (1 - ease(seg(t, RS(12.9), RS(13.5))));
  slFill.style.width = px(Math.max(0, (SX1 - SX0) * v + 0));
  ticks.forEach((e, i) => { e.style.background = v * 10 >= i - 0.001 && v > 0 ? 'var(--green)' : 'var(--edge)'; });
  const tipOp = clamp((t - T.slider) / .1) * (1 - clamp((t - T.rollEnd) / .2));
  tip.style.opacity = tipOp; tip.style.left = px(SX0 + (SX1 - SX0) * v - 60); tip.style.transform = `translateY(${(1 - tipOp) * 10}px)`;
  txt(tip, Math.round(v * 100) + '%');
  slSlot.style.opacity = t > T.slider + .02 && t < RS(12.9) ? 1 : 1;
  txt(lab2, v >= 1 ? 'Indexing · Reached 100' : 'Indexing · Reading every page');

  // ---- station 3: cards ----
  const hit = [T.c1, T.c2, T.c3], dis = [RS(12.6), RS(12.75), RS(12.9)];
  notif.forEach((n, i) => {
    const pop = spring(t - (hit[i] - .1), 26, .7) * (1 - ease(seg(t, dis[i], dis[i] + .25)));   // starts just before contact so the card is there when the ball lands
    n.style.opacity = clamp(pop * 1.6);
    n.style.transform = `translateY(${dip(t - hit[i]) * 12}px) scale(${.82 + .18 * clamp(pop, 0, 1.15)})`;
  });
  const allHit = t >= T.c3 && t < RS(12.9);
  txt(lab3, allHit ? 'Pipeline · Ready to answer' : 'Pipeline · Something is falling');

  // ---- station 4: keyboard ----
  for (const k in keyEls) { keyEls[k].style.transform = ''; keyEls[k].style.background = 'var(--card)'; keyEls[k].style.boxShadow = '0 7px 0 var(--rule)'; }
  KEYHITS.forEach(([id, ts]) => {
    let d = 0; ts.forEach(h0 => { d = Math.max(d, dip(t - h0)); });
    const e = keyEls[id]; e.style.transform = `translateY(${d * 7}px)`; e.style.boxShadow = `0 ${7 - d * 7}px 0 var(--rule)`; e.style.background = mixc(C.paper, C.wash, clamp(d * 1.3));
  });
  { const d = dipLong(t - T.ret); retKey.style.transform = `translateY(${d * 7}px)`; retKey.style.boxShadow = `0 ${7 - d * 7}px 0 var(--rule)`; retKey.style.background = mixc(C.paper, C.wash, d); }
  const nTyped = t < T.ret ? TYPE_T.filter(x => t >= x - .005).length : 0;
  const ghostOp = ease(seg(t, T.kY + .05, T.kY + .25)) * (t < T.ret ? 1 : 0);
  const caret = t >= T.kC - .15 && t < T.ret && (Math.floor(t * 6) % 2 === 0 || nTyped > 0 && t - TYPE_T[nTyped - 1] < .3);
  if (nTyped === 0) html(inpText, `<span style="color:#8e9792">Ask about your documents</span>`);
  else html(inpText, `${'carry'.slice(0, nTyped)}${caret ? '<span style="display:inline-block;width:3px;height:44px;background:#1a5d48;vertical-align:-6px;margin-left:2px"></span>' : ''}<span style="color:#8e9792;opacity:${ghostOp}"> over unused leave in Germany?</span>`);
  txt(lab4, t >= T.ret && t < RS(12.5) ? 'Ask · Sent' : 'Ask · Type a question');

  // ---- station 5: answer ----
  const rs = 1 - ease(seg(t, RS(12.3), RS(12.7)));
  const bA = spring(t - (T.ret + .1), 18, .8) * rs;
  bubble.style.opacity = clamp(bA * 1.5); bubble.style.transform = `translateY(${(1 - bA) * 30}px)`;
  const gA = spring(t - (T.ret + .3), 18, .8) * rs;
  badge.style.opacity = clamp(gA * 1.5); badge.style.transform = `translateY(${(1 - gA) * 20}px)`;
  const prog = ease(seg(t, T.ret + .35, T.ret + 1.6)) * rs; let n = Math.round(ANS_LEN * prog), out = '';
  for (const [s, b] of PIECES) { if (n <= 0) break; const part = s.slice(0, n); n -= s.length; out += b ? `<b style="font-weight:600">${part}</b>` : part; }
  if (prog >= 1) out += ` <span class="mono" style="background:#1a5d48;color:#f9fcfa;border-radius:8px;padding:2px 10px;font-size:26px;vertical-align:3px">1</span>`;
  html(ans, out);
  const cA = spring(t - (T.ret + .2), 18, .8) * rs;
  srcCap.style.opacity = clamp(cA * 1.5); chip1.style.opacity = clamp(cA * 1.5); chip2.style.opacity = clamp(cA * 1.5);
  chip1.style.transform = chip2.style.transform = `translateY(${(1 - cA) * 20}px)`;
  const act = ease(seg(t, T.press, T.press + .2)) * rs;
  chip1.style.background = mixc(C.wash, C.green, act); chip1.style.color = mixc(hex('#1d3a30'), C.paper, act);
  chip1.style.transform = `translateY(${(1 - cA) * 20 + dip(t - T.press) * 8}px)`;
  txt(lab5, act > .5 ? 'Source · Page 16, highlighted' : 'Answer · From your documents');

  // ---- cited page ----
  const pg = spring(t - T.page, 15, .85) * (1 - ease(seg(t, RS(12.0), RS(12.4))));
  page.style.opacity = clamp(pg * 1.6);
  page.style.transform = `translate(${(1 - pg) * -70}px,${(1 - pg) * 40}px) scale(${.94 + .06 * clamp(pg, 0, 1.1)})`;
  hlmark.style.backgroundSize = (ease(seg(t, T.hlA, T.hlB)) * (1 - ease(seg(t, RS(12.0), RS(12.3)))) * 100).toFixed(2) + '% 100%';
}
window.seek = seek;
seek(0);

// ---------- sound ----------
function schedule(c) {
  const sr = c.sampleRate, rand = rng(11);
  const master = c.createGain(); master.gain.value = .85; master.connect(c.destination);
  const noiseB = c.createBuffer(1, sr * 2, sr); { const d = noiseB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rand() * 2 - 1; }
  const rev = c.createConvolver(); { const len = Math.floor(sr * 1.6), ir = c.createBuffer(2, len, sr); for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (rand() * 2 - 1) * Math.pow(1 - i / len, 3.2); } rev.buffer = ir; }
  const revG = c.createGain(); revG.gain.value = .5; rev.connect(revG); revG.connect(master);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const env = (g, t0, a, peak, dec, end = .0001) => { g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(end, t0 + a + dec); };
  function osc(type, f, t0, dur, peak, dec, dest, send = 0, f2) {
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    env(g, t0, .003, peak, dec); o.connect(g); g.connect(dest || master); if (send) { const s = c.createGain(); s.gain.value = send; g.connect(s); s.connect(rev); }
    o.start(t0); o.stop(t0 + dur + .05);
  }
  function noise(t0, dur, type, f, q, peak, f2) {
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = noiseB; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f, t0); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    env(g, t0, .002, peak, dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t0, rand() * 1.5); s.stop(t0 + dur + .05);
  }
  const penta = [0, 2, 4, 7, 9], deg = k => 12 * Math.floor(k / 5) + penta[k % 5];
  const marimba = (t0, k, vel = 1) => { const m = 60 + deg(k), f = mtof(m); osc('sine', f, t0, .6, .34 * vel, .55, master, .35); osc('sine', f * 4, t0, .2, .08 * vel, .12, master, .2); };
  const whoosh = (t0, dur, f0, f1, peak) => { const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); s.buffer = noiseB; s.loop = true; fl.type = 'bandpass'; fl.Q.value = 1.1; fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + dur * .55); g.gain.linearRampToValueAtTime(.0001, t0 + dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t0, 0); s.stop(t0 + dur + .05); };

  // groove: 120 BPM
  const roots = [36, 33, 41, 43], chords = [[60, 64, 67, 71], [57, 60, 64, 67], [60, 65, 69, 72], [59, 62, 67, 71]];
  for (let bar = 0; bar < D / 2; bar++) {
    const t0 = bar * 2, ci = Math.floor(bar / 2) % 4, root = roots[ci];
    if (bar % 2 === 0) chords[ci].forEach(m => { [-4, 4].forEach(dt => {
      const o = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = dt; fl.type = 'lowpass'; fl.frequency.value = 1100;
      g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(.022, t0 + 1.2); g.gain.setValueAtTime(.022, t0 + 3.2); g.gain.linearRampToValueAtTime(.0001, t0 + 4.4); o.connect(fl); fl.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 4.5); }); });
    if (t0 >= 2) [[0, 0], [.75, 7], [1.5, 0]].forEach(([bt, iv]) => { const tt = t0 + bt, o = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(root + iv); fl.type = 'lowpass'; fl.frequency.setValueAtTime(520, tt); fl.frequency.exponentialRampToValueAtTime(140, tt + .25);
      env(g, tt, .004, .16, .26); o.connect(fl); fl.connect(g); g.connect(master); o.start(tt); o.stop(tt + .35); });
    for (let b = 0; b < 4; b++) {
      const tt = t0 + b * .5;
      if (tt >= 2) osc('sine', 120, tt, .16, .42, .22, master, 0, 46);
      noise(tt + .25, .05, 'highpass', 8000, .7, .05);
    }
  }
  // hero contacts: rising marimba line
  CONTACTS.forEach((ct, k) => marimba(ct, k));
  osc('sine', 90, 0, .2, .35, .2, master, 0, 45);
  // toggle
  noise(T.knobA, .04, 'bandpass', 2600, 2, .22); fileRows.forEach((r, i) => osc('sine', 600 + i * 120, T.knobA + .12 + i * .14, .12, .08, .1, master, .2, 380));
  // slider ticks (accelerating)
  for (let i = 1; i <= 20; i++) { const tt = T.slider + ROLL_DUR * Math.pow(i / 20, 1 / ROLL_P); noise(tt, .02, 'bandpass', 4200 + i * 90, 3, .1 + i * .004); }
  // notification pops
  [T.c1, T.c2, T.c3].forEach((ct, i) => osc('sine', 760 + i * 90, ct, .12, .18, .1, master, .3, 380));
  // keys
  [T.kC, T.kA, T.kR1, T.kR2, T.kY].forEach(kt => noise(kt, .03, 'bandpass', 3400, 2.5, .26));
  noise(T.ret, .06, 'lowpass', 900, 1, .45); osc('sine', 150, T.ret, .12, .3, .12, master, 0, 70);
  // answer stream: soft ticks, chip press, page swish
  for (let i = 0; i < 26; i++) noise(T.ret + .35 + i * (1.25 / 26), .012, 'bandpass', 5200, 3, .035);
  noise(T.press, .05, 'bandpass', 2200, 2, .25); noise(T.page, .35, 'bandpass', 3800, .8, .1, 1400);
  // launch and reveal
  whoosh(T.launch, .9, 260, 3600, .26); whoosh(DS, 1.4, 3400, 260, .22);
  // resets: descending ticks while the world rewinds
  [12.0, 12.3, 12.6, 12.75, 12.9, 13.1, 13.3, 13.45].forEach((tt, i) => osc('sine', 900 - i * 70, RS(tt), .09, .09, .08, master, .25, 500 - i * 30));
}
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, TAIL = 1.8, n = Math.ceil(sr * D);
  const off = new OfflineAudioContext(2, Math.ceil(sr * (D + TAIL)), sr);
  schedule(off);
  const buf = await off.startRendering();
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length - n; i++) d[i] += d[n + i]; }
  const out = ctx.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++) out.getChannelData(ch).set(buf.getChannelData(ch).subarray(0, n));
  const src = ctx.createBufferSource(); src.buffer = out; src.connect(ctx.destination); src.start(0);
};

// ---------- preview ----------
function fit() { if (RENDER) { stage.style.transform = 'none'; return; } const k = Math.min(innerWidth / W, (innerHeight - 56) / H); stage.style.transform = `scale(${k})`; }
addEventListener('resize', fit); fit();
if (!RENDER) {
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  const pp = document.getElementById('pp'), scr = document.getElementById('scr'), tm = document.getElementById('tm');
  async function play() {
    ac ??= new AudioContext();
    if (!buf) { pp.textContent = 'Rendering sound…'; const off = new OfflineAudioContext(2, Math.ceil(48000 * D), 48000); await buildAudio(off); buf = await off.startRendering(); }
    src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    src.start(0, offset % D); startAt = ac.currentTime; playing = true; pp.textContent = 'Pause';
  }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pp.textContent = 'Play'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % D : offset;
  pp.onclick = () => playing ? pause() : play();
  scr.oninput = () => { const was = playing; pause(); offset = +scr.value; seek(offset); if (was) play(); };
  (function loop() { const t = now(); seek(t); if (playing) scr.value = t; tm.textContent = t.toFixed(2) + 's'; requestAnimationFrame(loop); })();
}
</script>
